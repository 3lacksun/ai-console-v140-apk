name: AI Console Android APK CI

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: preview or production
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  SIGNING_MODE: ${{ inputs.signing_mode || 'preview' }}
  PREVIEW_APK_NAME: CommandCentre_v1.5.5_preview-debug-signed.apk
  PRODUCTION_APK_NAME: CommandCentre_v1.5.5_production-release-signed.apk
  DIAGNOSTICS_DIR: ci-diagnostics

jobs:
  build-android-apk:
    name: Release APK with embedded JS
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Env setup
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          node --version
          npm --version
          java --version
