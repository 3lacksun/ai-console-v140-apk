name: AI Console Android APK CI

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: preview or production
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  SIGNING_MODE: ${{ inputs.signing_mode || 'preview' }}
  PREVIEW_APK_NAME: AI_Console_v1.4.0_preview-release-js-embedded.apk
  PRODUCTION_APK_NAME: AI_Console_v1.4.0_production-release-signed.apk
  DIAGNOSTICS_DIR: ci-diagnostics

jobs:
  build-android-apk:
    name: Release APK with embedded JS
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Env setup
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          node --version
          npm --version
          java -version

      - name: npm install
        run: npm install --no-fund --legacy-peer-deps

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Expo prebuild
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Use debug keystore for release (preview only)
        if: ${{ env.SIGNING_MODE != 'production' }}
        run: |
          set -euo pipefail
          # Ensure a trailing newline before appending so the last existing key is not concatenated.
          # Debug builds do NOT embed JS; release builds do. Splash hang was caused by assembleDebug.
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          MYAPP_UPLOAD_STORE_FILE=debug.keystore
          MYAPP_UPLOAD_KEY_ALIAS=androiddebugkey
          MYAPP_UPLOAD_STORE_PASSWORD=android
          MYAPP_UPLOAD_KEY_PASSWORD=android
          EOF
          # Force release signingConfig to use the debug keystore for preview builds.
          if [ -f android/app/build.gradle ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts || true
          fi
          echo "Preview release will use debug signing"

      - name: Gradle assembleRelease
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android && ./gradlew app:assembleRelease --no-daemon --max-workers=2

      - name: Label APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          fi
          test -f "$APK"
          if [ "$SIGNING_MODE" = "production" ]; then
            cp "$APK" "$PRODUCTION_APK_NAME"
            echo "APK_PATH=$PRODUCTION_APK_NAME" >> "$GITHUB_ENV"
          else
            cp "$APK" "$PREVIEW_APK_NAME"
            echo "APK_PATH=$PREVIEW_APK_NAME" >> "$GITHUB_ENV"
          fi
          ls -lh "$APK_PATH"

      - name: Verify JS embedded
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTICS_DIR/apk-js"
          unzip -q "$APK_PATH" -d "$DIAGNOSTICS_DIR/apk-js"
          find "$DIAGNOSTICS_DIR/apk-js" -type f | sort | tee "$DIAGNOSTICS_DIR/apk-files.txt"
          if ! find "$DIAGNOSTICS_DIR/apk-js" -type f \( -name '*.bundle' -o -name '*.hbc' -o -name 'index.android.bundle' \) | grep -q .; then
            echo "No embedded JS/Hermes bundle — would hang on splash" >&2
            exit 1
          fi
          echo "EMBEDDED_JS=PASS"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ env.SIGNING_MODE == 'production' && 'AI_Console_v1.4.0_production-release-signed' || 'AI_Console_v1.4.0_preview-release-js-embedded' }}
          path: |
            ${{ env.PREVIEW_APK_NAME }}
            ${{ env.PRODUCTION_APK_NAME }}
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AI_Console_v1.4.0_android-ci-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 30
