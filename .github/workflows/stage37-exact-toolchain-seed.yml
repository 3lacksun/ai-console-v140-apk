name: Stage37 Exact Android Toolchain Seed

on:
  push:
    branches:
      - ai-companion-stage37-toolchain-seed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Recover exact Gradle 8.11.1 distribution
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o gradle-8.11.1-bin.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  gradle-8.11.1-bin.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gradle-dist"
          unzip -q gradle-8.11.1-bin.zip -d "$RUNNER_TEMP/gradle-dist"
          "$RUNNER_TEMP/gradle-dist/gradle-8.11.1/bin/gradle" --version | tee gradle-version.txt
          grep -F 'Gradle 8.11.1' gradle-version.txt

      - name: Create exact AGP and Chaquopy probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage37-probe
          mkdir -p stage37-probe/app/src/main/python
          cat > stage37-probe/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Stage37ExactProbe'
          include ':app'
          EOF
          cat > stage37-probe/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
              id 'com.chaquo.python' version '17.0.0' apply false
          }
          EOF
          cat > stage37-probe/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }

          android {
              namespace 'example.stage37.probe'
              compileSdk 36
              defaultConfig {
                  applicationId 'example.stage37.probe'
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
                  ndk { abiFilters 'arm64-v8a' }
              }
          }

          chaquopy {
              defaultConfig {
                  version = '3.13'
                  buildPython('python3.13')
              }
          }
          EOF
          cat > stage37-probe/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Stage37 Exact Probe" />
          </manifest>
          EOF
          cat > stage37-probe/app/src/main/python/main.py <<'EOF'
          VALUE = 'stage37-exact-toolchain-probe'
          EOF

      - name: Resolve exact dependency closure and assemble probe
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/stage37-gradle-home"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$RUNNER_TEMP/gradle-dist/gradle-8.11.1/bin/gradle" \
            -p stage37-probe \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug
          test -f stage37-probe/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify exact identities
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/stage37-gradle-home"
          CACHE="$GRADLE_USER_HOME/caches/modules-2/files-2.1"
          test -d "$CACHE/com.android.tools.build/gradle/8.9.2"
          test -d "$CACHE/com.android.application/com.android.application.gradle.plugin/8.9.2"
          test -d "$CACHE/com.chaquo.python/gradle/17.0.0"
          test -d "$CACHE/com.chaquo.python/com.chaquo.python.gradle.plugin/17.0.0"
          find "$CACHE/com.android.tools.build/gradle/8.9.2" -type f -print | sort | tee agp-8.9.2-files.txt
          find "$CACHE/com.chaquo.python" -type f -print | sort | tee chaquopy-17.0.0-files.txt
          test -s agp-8.9.2-files.txt
          test -s chaquopy-17.0.0-files.txt
          find "$GRADLE_USER_HOME/caches/modules-2" -type f -print | sort > gradle-modules-files.txt
          while IFS= read -r f; do sha256sum "$f"; done < gradle-modules-files.txt > gradle-modules-sha256.txt
          sha256sum gradle-8.11.1-bin.zip > gradle-distribution-sha256.txt
          sha256sum stage37-probe/app/build/outputs/apk/debug/app-debug.apk > probe-apk-sha256.txt

      - name: Package verified reusable closure
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/stage37-gradle-home"
          rm -rf stage37-exact-toolchain
          mkdir -p stage37-exact-toolchain/gradle-user-home/caches
          cp gradle-8.11.1-bin.zip stage37-exact-toolchain/
          cp -a "$GRADLE_USER_HOME/caches/modules-2" stage37-exact-toolchain/gradle-user-home/caches/
          cp gradle-version.txt agp-8.9.2-files.txt chaquopy-17.0.0-files.txt \
             gradle-modules-files.txt gradle-modules-sha256.txt \
             gradle-distribution-sha256.txt probe-apk-sha256.txt \
             stage37-exact-toolchain/
          cat > stage37-exact-toolchain/RECOVERY_MANIFEST.txt <<'EOF'
          purpose=generic exact Android dependency seed
          gradle=8.11.1
          gradle_sha256=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
          android_gradle_plugin=8.9.2
          chaquopy_gradle_plugin=17.0.0
          python=3.13
          jdk=21
          compileSdk=36
          targetSdk=36
          minSdk=24
          abi=arm64-v8a
          source_contains_application_code=false
          provenance=GitHub-hosted Ubuntu runner resolving official Gradle distribution, Google Maven, Maven Central and Gradle Plugin Portal
          verification=probe assembleDebug passed and exact requested module coordinates were asserted before packaging
          EOF
          tar -C stage37-exact-toolchain -czf STAGE37_EXACT_ANDROID_TOOLCHAIN_SEED.tar.gz .
          sha256sum STAGE37_EXACT_ANDROID_TOOLCHAIN_SEED.tar.gz | tee STAGE37_EXACT_ANDROID_TOOLCHAIN_SEED.tar.gz.sha256

      - name: Upload verified dependency seed
        uses: actions/upload-artifact@v4
        with:
          name: stage37-exact-android-toolchain-seed
          path: |
            STAGE37_EXACT_ANDROID_TOOLCHAIN_SEED.tar.gz
            STAGE37_EXACT_ANDROID_TOOLCHAIN_SEED.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
