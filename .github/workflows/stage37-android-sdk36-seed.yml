name: Stage37 Android SDK 36 Seed

on:
  push:
    branches:
      - ai-companion-stage37-toolchain-seed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact SDK 36 components from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          SDK="$ANDROID_SDK_ROOT"
          test -f "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/build-tools/36.0.0/aapt2"
          test -f "$SDK/build-tools/36.0.0/apksigner"
          test -x "$SDK/build-tools/36.0.0/zipalign"
          "$SDK/build-tools/36.0.0/aapt2" version | tee aapt2-version.txt
          "$SDK/build-tools/36.0.0/apksigner" version | tee apksigner-version.txt
          "$SDK/build-tools/36.0.0/zipalign" -h > zipalign-help.txt 2>&1 || true
          printf '%s\n' "$SDK" > android-sdk-root.txt

      - name: Package reusable SDK closure
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(cat android-sdk-root.txt)"
          OUT=stage37-android-sdk36
          rm -rf "$OUT"
          mkdir -p "$OUT/platforms" "$OUT/build-tools" "$OUT/platform-tools" "$OUT/licenses"
          cp -a "$SDK/platforms/android-36" "$OUT/platforms/"
          cp -a "$SDK/build-tools/36.0.0" "$OUT/build-tools/"
          cp -a "$SDK/platform-tools/." "$OUT/platform-tools/"
          if [ -d "$SDK/licenses" ]; then cp -a "$SDK/licenses/." "$OUT/licenses/"; fi
          cp aapt2-version.txt apksigner-version.txt zipalign-help.txt "$OUT/"
          cat > "$OUT/RECOVERY_MANIFEST.txt" <<'EOF'
          purpose=generic Android SDK 36 local build seed
          source_contains_application_code=false
          application_payload_included=false
          platform=platforms;android-36
          build_tools=build-tools;36.0.0
          platform_tools=platform-tools
          provenance=GitHub-hosted Ubuntu 24.04 runner preinstalled Android SDK plus sdkmanager
          verification=android.jar,aapt2,apksigner,zipalign asserted before packaging
          EOF
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SDK_SHA256SUMS.txt)
          tar -C "$OUT" -czf STAGE37_ANDROID_SDK36_SEED.tar.gz .
          sha256sum STAGE37_ANDROID_SDK36_SEED.tar.gz | tee STAGE37_ANDROID_SDK36_SEED.tar.gz.sha256

      - name: Upload SDK seed
        uses: actions/upload-artifact@v4
        with:
          name: stage37-android-sdk36-seed
          path: |
            STAGE37_ANDROID_SDK36_SEED.tar.gz
            STAGE37_ANDROID_SDK36_SEED.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
